<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="mbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0f1a"/><stop offset="1" stop-color="#141a2e"/></linearGradient>
    <filter id="mblur"><feGaussianBlur stdDeviation="22"/></filter>
    <pattern id="mgrid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".045"/></pattern>
    <style>
      @keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-16px) rotate(2deg)}}
      @keyframes bob2{0%,100%{transform:translateY(-10px) rotate(2deg)}50%{transform:translateY(8px) rotate(-3deg)}}
      @keyframes twinkle{0%,100%{opacity:.2;transform:scale(.6)}50%{opacity:1;transform:scale(1.2)}}
      @keyframes fade{0%,100%{opacity:.5}50%{opacity:1}}
      @keyframes shadow{0%,100%{transform:scaleX(1);opacity:.35}50%{transform:scaleX(.8);opacity:.2}}
      .smudge{transform-origin:300px 260px;animation:bob 4s ease-in-out infinite}
      .receipts{transform-origin:900px 230px;animation:bob2 5s ease-in-out infinite}
      .sh1{transform-origin:300px 352px;animation:shadow 4s ease-in-out infinite}
      .sh2{transform-origin:900px 352px;animation:shadow 5s ease-in-out infinite}
      .tw{transform-box:fill-box;transform-origin:center;animation:twinkle ease-in-out infinite}
      .name{font:800 30px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#fff}
      .tag{font:500 16px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#aab4d4}
      .hdr{font:700 15px 'SFMono-Regular',Consolas,monospace;fill:#5eead4;letter-spacing:3px}
      .bubble{font:600 15px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#0b0f1a}
      .b1{animation:fade 4s ease-in-out infinite}
      .b2{animation:fade 5s ease-in-out infinite}
    </style>
  </defs>
  <rect width="1200" height="400" rx="24" fill="url(#mbg)"/>
  <rect width="1200" height="400" rx="24" fill="url(#mgrid)"/>
  <circle cx="300" cy="230" r="170" fill="#F26B57" opacity=".18" filter="url(#mblur)"/>
  <circle cx="900" cy="230" r="170" fill="#ffc53d" opacity=".16" filter="url(#mblur)"/>

  <g fill="#fff">
    <path class="tw" style="animation-duration:2.2s" d="M120 70l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/>
    <path class="tw" style="animation-duration:3s;animation-delay:-1s" d="M560 60l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/>
    <path class="tw" style="animation-duration:2.6s;animation-delay:-.5s" d="M640 330l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/>
    <path class="tw" style="animation-duration:3.4s;animation-delay:-2s" d="M1090 90l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/>
    <path class="tw" style="animation-duration:2.8s;animation-delay:-1.4s" d="M1120 300l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/>
  </g>

  <text x="600" y="48" text-anchor="middle" class="hdr">MEET THE MASCOTS</text>

  <!-- Smudge -->
  <ellipse class="sh1" cx="300" cy="352" rx="90" ry="10" fill="#000"/>
  <g class="smudge"><g transform="translate(180 90) scale(1)">
  <title id="t">Smudge, the Fingerprint mascot</title>
