<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f1a"/>
      <stop offset="100%" stop-color="#141a2e"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff5f6d"/>
      <stop offset="25%" stop-color="#ffc371"/>
      <stop offset="50%" stop-color="#5eead4"/>
      <stop offset="75%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#ff5f6d"/>
      <animate attributeName="x1" values="-1;0.5;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;1.5;2" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="1.2"/></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <style>
      .title{font:800 70px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;letter-spacing:-2px}
      .sub{font:500 22px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#aab4d4}
      .mono{font:600 15px 'SFMono-Regular',Consolas,'Courier New',monospace;fill:#5eead4}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
      @keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-340px);opacity:0}}
      .orbit{transform-origin:1000px 160px;animation:spin 14s linear infinite}
      .orbit2{transform-origin:1000px 160px;animation:spin 22s linear infinite reverse}
      .float{animation:float 5s ease-in-out infinite}
      .cursor{animation:blink 1s step-end infinite}
      .p{animation:rise linear infinite}
    </style>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>

  <!-- ambient glows -->
  <circle cx="180" cy="60" r="160" fill="#ff5f6d" opacity="0.18" filter="url(#blur)">
    <animate attributeName="cx" values="180;260;180" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1000" cy="300" r="190" fill="#5eead4" opacity="0.16" filter="url(#blur)">
    <animate attributeName="cy" values="300;220;300" dur="11s" repeatCount="indefinite"/>
  </circle>

  <!-- rising particles -->
  <g fill="#ffffff">
    <circle class="p" cx="90"  cy="330" r="2"   style="animation-duration:7s;animation-delay:-1s"/>
    <circle class="p" cx="240" cy="330" r="1.5" style="animation-duration:9s;animation-delay:-4s"/>
    <circle class="p" cx="420" cy="330" r="2.5" style="animation-duration:8s;animation-delay:-2s"/>
    <circle class="p" cx="560" cy="330" r="1.5" style="animation-duration:10s;animation-delay:-6s"/>
    <circle class="p" cx="700" cy="330" r="2"   style="animation-duration:7.5s;animation-delay:-3s"/>
    <circle class="p" cx="860" cy="330" r="1.5" style="animation-duration:9.5s;animation-delay:-5s"/>
    <circle class="p" cx="1120" cy="330" r="2"  style="animation-duration:8.5s;animation-delay:-7s"/>
  </g>

  <!-- orbital system on the right -->
  <g class="float">
    <circle cx="1000" cy="160" r="120" fill="url(#glow)"/>
    <circle cx="1000" cy="160" r="34" fill="url(#shine)"/>
    <circle cx="1000" cy="160" r="34" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1.5"/>
    <circle cx="1000" cy="160" r="78" fill="none" stroke="#818cf8" stroke-opacity=".45" stroke-dasharray="4 6"/>
    <circle cx="1000" cy="160" r="112" fill="none" stroke="#5eead4" stroke-opacity=".35" stroke-dasharray="2 8"/>
    <g class="orbit">
      <circle cx="1078" cy="160" r="8" fill="#5eead4"/>
      <circle cx="1078" cy="160" r="14" fill="#5eead4" opacity=".25"/>
    </g>
    <g class="orbit2">
      <circle cx="888" cy="160" r="6" fill="#ffc371"/>
      <circle cx="888" cy="160" r="11" fill="#ffc371" opacity=".25"/>
      <circle cx="1112" cy="160" r="5" fill="#ff5f6d"/>
    </g>
  </g>

  <!-- text -->
  <text x="70" y="128" class="mono">~/arnav $ whoami<tspan class="cursor">▌</tspan></text>
  <text x="68" y="200" class="title" fill="url(#shine)">Arnav Gupta</text>
  <text x="70" y="244" class="sub">Building agents that ship · ML · full‑stack · hackathon regular</text>
  <g filter="url(#soft)" opacity=".9">
    <rect x="70" y="268" width="150" height="26" rx="13" fill="#5eead4" fill-opacity=".12" stroke="#5eead4" stroke-opacity=".5"/>
    <text x="145" y="286" text-anchor="middle" style="font:600 13px Inter,Helvetica,Arial,sans-serif;fill:#5eead4">AI AGENTS</text>
    <rect x="232" y="268" width="130" height="26" rx="13" fill="#818cf8" fill-opacity=".12" stroke="#818cf8" stroke-opacity=".5"/>
    <text x="297" y="286" text-anchor="middle" style="font:600 13px Inter,Helvetica,Arial,sans-serif;fill:#a5b4fc">PYTHON</text>
    <rect x="374" y="268" width="150" height="26" rx="13" fill="#ffc371" fill-opacity=".12" stroke="#ffc371" stroke-opacity=".5"/>
    <text x="449" y="286" text-anchor="middle" style="font:600 13px Inter,Helvetica,Arial,sans-serif;fill:#ffc371">TYPESCRIPT</text>
    <rect x="536" y="268" width="170" height="26" rx="13" fill="#ff5f6d" fill-opacity=".12" stroke="#ff5f6d" stroke-opacity=".5"/>
    <text x="621" y="286" text-anchor="middle" style="font:600 13px Inter,Helvetica,Arial,sans-serif;fill:#ff8a94">DEEP LEARNING</text>
  </g>
</svg>
