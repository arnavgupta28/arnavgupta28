    <style>
      .h{font:800 26px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#fff}
      .d{font:400 14.5px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#c9d1d9}
