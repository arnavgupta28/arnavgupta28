<svg xmlns="http://www.w3.org/2000/svg" width="600" height="230" viewBox="0 0 600 230">
  <defs>
    <linearGradient id="bd" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#F26B57"/><stop offset=".5" stop-color="#ffc371"/><stop offset="1" stop-color="#F26B57"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#F26B57" stop-opacity=".35"/><stop offset="1" stop-color="#F26B57" stop-opacity="0"/></radialGradient>
    <clipPath id="cardclip"><rect x="2" y="2" width="596" height="226" rx="18"/></clipPath>
    <style>
      .h{font:800 26px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#fff}
      .d{font:400 14.5px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#c9d1d9}
      .t{font:600 11.5px 'Segoe UI',Inter,Helvetica,Arial,sans-serif}
      .l{font:500 13px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#8b949e}
      .b{font:700 12.5px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#0b0f1a}
      @keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(3deg)}}
      @keyframes sh{0%,100%{transform:scaleX(1);opacity:.45}50%{transform:scaleX(.75);opacity:.2}}
      @keyframes pop{0%,15%{opacity:0;transform:scale(.6)}25%,80%{opacity:1;transform:scale(1)}90%,100%{opacity:0;transform:scale(.8)}}
      @keyframes sweep{0%{transform:translateX(-200px)}60%,100%{transform:translateX(800px)}}
      @keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
      .m{transform-box:view-box;transform-origin:500px 162px;animation:bob 3.6s ease-in-out infinite}
      .s{transform-box:fill-box;transform-origin:center;animation:sh 3.6s ease-in-out infinite}
      .p{transform-box:fill-box;transform-origin:right bottom;animation:pop 5s ease-in-out infinite}
      .sw{animation:sweep 5s ease-in-out infinite}
      .tw{animation:tw ease-in-out infinite}
    </style>
  </defs>
  <rect x="1" y="1" width="598" height="228" rx="19" fill="#0b0f1a"/>
  <g clip-path="url(#cardclip)">
    <circle cx="500" cy="122" r="120" fill="url(#halo)"/>
    <rect class="sw" x="0" y="-40" width="60" height="320" fill="#fff" opacity=".05" transform="skewX(-20)"/>
    <circle class="tw" style="animation-duration:2.4s" cx="560" cy="30" r="2" fill="#fff"/>
    <circle class="tw" style="animation-duration:3.1s;animation-delay:-1s" cx="380" cy="205" r="1.6" fill="#fff"/>
    <circle class="tw" style="animation-duration:2.7s;animation-delay:-.6s" cx="580" cy="190" r="1.8" fill="#fff"/>
  </g>
  <rect x="1.5" y="1.5" width="597" height="227" rx="19" fill="none" stroke="url(#bd)" stroke-width="2.5"/>

  <circle cx="34" cy="38" r="6" fill="#3572A5"/>
  <text x="46" y="43" class="l">Python  ·  github.com/arnavgupta28</text>
  <text x="28" y="76" class="h">Fingerprint</text>
  <text x="28" y="98" class="d">See what the internet knows about you,</text><text x="28" y="120" class="d">before someone else does. Live scan,</text><text x="28" y="142" class="d">confidence scores, removal guides.</text>
  <rect x="28" y="172" width="75" height="22" rx="11" fill="#F26B57" fill-opacity=".12" stroke="#F26B57" stroke-opacity=".55"/><text x="66" y="187" text-anchor="middle" class="t" fill="#F26B57">PRIVACY</text><rect x="111.19999999999999" y="172" width="83" height="22" rx="11" fill="#F26B57" fill-opacity=".12" stroke="#F26B57" stroke-opacity=".55"/><text x="153" y="187" text-anchor="middle" class="t" fill="#F26B57">LIVE APP</text><rect x="202.0" y="172" width="68" height="22" rx="11" fill="#F26B57" fill-opacity=".12" stroke="#F26B57" stroke-opacity=".55"/><text x="236" y="187" text-anchor="middle" class="t" fill="#F26B57">AGENTS</text>

  <ellipse class="s" cx="500" cy="180" rx="44" ry="6" fill="#000"/>
  <g class="m"><g transform="translate(440 52) scale(0.5)">
  
  <defs>
    <clipPath id="fp-smudge-body">
      <path d="M112 34 C160 34 186 78 186 128 C186 180 154 210 112 210 C70 210 38 180 38 128 C38 78 64 34 112 34 Z"/>
    </clipPath>
  </defs>

  <!-- shadow -->
  <ellipse cx="114" cy="224" rx="60" ry="7" fill="#1F1F2B" opacity="0.10"/>

  <!-- feet -->
  <ellipse cx="90" cy="210" rx="17" ry="9" fill="#E0503B"/>
  <ellipse cx="136" cy="210" rx="17" ry="9" fill="#E0503B"/>

  <!-- waving arm (behind body) -->
  <path d="M48 128 Q26 116 26 90" fill="none" stroke="#E0503B" stroke-width="13" stroke-linecap="round"/>

  <!-- body -->
  <path d="M112 34 C160 34 186 78 186 128 C186 180 154 210 112 210 C70 210 38 180 38 128 C38 78 64 34 112 34 Z" fill="#F26B57"/>

  <!-- fingerprint ridges -->
  <g clip-path="url(#fp-smudge-body)" fill="none" stroke="#FF9E8A" stroke-width="4.5" stroke-linecap="round">
    <ellipse cx="112" cy="86" rx="11" ry="15"/>
    <ellipse cx="112" cy="90" rx="23" ry="29" stroke-dasharray="118 16"/>
    <ellipse cx="112" cy="95" rx="35" ry="43" stroke-dasharray="70 14 150 12"/>
    <ellipse cx="112" cy="100" rx="47" ry="57" stroke-dasharray="200 18 90 14"/>
    <ellipse cx="112" cy="106" rx="59" ry="71" stroke-dasharray="130 16 220 12"/>
    <ellipse cx="112" cy="112" rx="71" ry="85" stroke-dasharray="260 20 160 16"/>
  </g>

  <!-- face patch keeps the face readable -->
  <ellipse cx="112" cy="140" rx="50" ry="34" fill="#F26B57"/>

  <!-- lashes -->
  <g stroke="#1F1F2B" stroke-width="3" stroke-linecap="round">
    <line x1="82" y1="113" x2="78" y2="105"/>
    <line x1="91" y1="110" x2="91" y2="101"/>
    <line x1="100" y1="113" x2="104" y2="105"/>
    <line x1="124" y1="113" x2="120" y2="105"/>
    <line x1="133" y1="110" x2="133" y2="101"/>
    <line x1="142" y1="113" x2="146" y2="105"/>
  </g>

  <!-- googly eyes -->
  <circle cx="91" cy="132" r="17" fill="#FFFFFF" stroke="#1F1F2B" stroke-width="3"/>
  <circle cx="133" cy="132" r="17" fill="#FFFFFF" stroke="#1F1F2B" stroke-width="3"/>
  <circle cx="94" cy="135" r="10" fill="#1F1F2B"/>
  <circle cx="136" cy="135" r="10" fill="#1F1F2B"/>
  <circle cx="97" cy="131" r="3.5" fill="#FFFFFF"/>
  <circle cx="139" cy="131" r="3.5" fill="#FFFFFF"/>

  <!-- smile -->
  <path d="M103 160 Q112 168 121 160" fill="none" stroke="#1F1F2B" stroke-width="3.5" stroke-linecap="round"/>

  <!-- arm holding the magnifier -->
  <path d="M180 148 Q192 154 194 166" fill="none" stroke="#E0503B" stroke-width="13" stroke-linecap="round"/>

  <!-- magnifying glass -->
  <line x1="200" y1="180" x2="224" y2="206" stroke="#1F1F2B" stroke-width="10" stroke-linecap="round"/>
  <circle cx="188" cy="164" r="24" fill="#FFF5EA" fill-opacity="0.85" stroke="#1F1F2B" stroke-width="7"/>
  <path d="M176 154 Q180 147 188 146" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
</g></g>
  <g class="p">
    <rect x="330" y="46" width="113" height="28" rx="14" fill="#F26B57"/>
    <text x="386" y="64" text-anchor="middle" class="b">Found you! 🔍</text>
  </g>
</svg>
